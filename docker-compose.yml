services:
  nginx:
    image: nginx:1.25
    container_name: om-nginx

    ports:
      - "8082:80"

    volumes:
      - ./src:/var/www/html
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - php

    restart: unless-stopped

    networks:
      - app_network

  php:
    image: php:7.3-fpm
    container_name: om-php-fpm

    volumes:
      - ./src:/var/www/html

    restart: unless-stopped

    networks:
      - app_network

  mysql:
    image: mysql:8.0
    container_name: om-mysql

    command: --default-authentication-plugin=mysql_native_password

    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_pass

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-prootpass"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped

    networks:
      - app_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: om-phpmyadmin

    ports:
      - "8081:80"

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: app_user
      PMA_PASSWORD: app_pass
      MYSQL_ROOT_PASSWORD: rootpass

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge
